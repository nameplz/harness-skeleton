name: Project CI

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

jobs:
  source-package:
    name: source-package
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject private cross-repository PR sources
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.private == true &&
          github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        run: |
          echo "Private cross-repository PR sources are unsupported because the base token cannot read their source."
          exit 1

      - name: Checkout trusted Harness source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || 'refs/heads/main' }}
          path: trusted

      - name: Checkout pull request source
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Checkout current source
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: candidate

      - name: Package project and trusted Harness source
        run: |
          tar --create --file "${RUNNER_TEMP}/trusted-source.tar" --directory trusted --exclude=.git .
          tar --create --file "${RUNNER_TEMP}/candidate-source.tar" --directory candidate --exclude=.git .

      - name: Upload project and trusted Harness source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-source
          path: |
            ${{ runner.temp }}/trusted-source.tar
            ${{ runner.temp }}/candidate-source.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  project-validation:
    name: project-validation
    needs: source-package
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download project and trusted Harness source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-source
          path: ${{ runner.temp }}

      - name: Extract project and trusted Harness source
        run: |
          mkdir trusted candidate
          tar --extract --file "${RUNNER_TEMP}/trusted-source.tar" --directory trusted --no-same-owner --no-same-permissions
          tar --extract --file "${RUNNER_TEMP}/candidate-source.tar" --directory candidate --no-same-owner --no-same-permissions

      - name: Initialize candidate Git metadata
        run: git init candidate

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run project checks with trusted Harness
        run: python3 -I trusted/scripts/harness.py check --full --root candidate --config-root trusted
