schema = 2

[checks]
quick = [
  ["python", "-m", "unittest", "discover", "-p", "test_fake_erp.py", "-q"],
]
full = [
  ["python", "-m", "unittest", "discover", "-q"],
]

[risk]
security_paths = [
  ".github/**",
  ".codex/hooks/**",
  ".harness/**",
  "deploy/**",
  "**/auth/**",
  "**/security/**",
  "**/migrations/**",
  "*.sql",
  "**/*.sql",
]
# security_keywords add hard T3 signals; hint keywords never set review routes.
security_hint_keywords = ["network client"]
