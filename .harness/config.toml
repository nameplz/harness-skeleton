schema = 2

[checks]
quick = [
  ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."],
]
full = [
  ["python", "scripts/harness.py", "doctor", "--root", "."],
  ["python", "-m", "compileall", "-q", "scripts", ".codex/hooks"],
  ["python", "-m", "unittest", "discover", "-s", "tests", "-t", "."],
]

[risk]
security_paths = [
  ".github/**",
  ".codex/hooks/**",
  ".harness/**",
  "deploy/**",
  "**/auth/**",
  "**/security/**",
  "**/migrations/**",
  "*.sql",
  "**/*.sql",
]
# security_keywords add hard T3 signals; hint keywords never set review routes.
security_hint_keywords = ["network client"]
