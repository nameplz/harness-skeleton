# Project-local Codex defaults.

[features]
multi_agent = true
hooks = true

[agents]
enabled = true

[agents.reviewer]
description = "Independent, read-only reviewer for T2/T3 requirement gaps, incorrect behavior, regressions, missing tests, and test_weakening justification."
config_file = "agents/reviewer.toml"

[agents.security_reviewer]
description = "Independent, read-only security reviewer for T3 trust boundaries, permissions, data exposure, and injection risks."
config_file = "agents/security-reviewer.toml"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python "$(git rev-parse --show-toplevel)/scripts/hooks/agent_hook.py"'
timeout = 960
statusMessage = "Checking Bash command policy"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python "$(git rev-parse --show-toplevel)/scripts/hooks/agent_hook.py"'
timeout = 180
statusMessage = "Running project validation"
