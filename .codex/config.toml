# Project-local Codex defaults.

[features]
multi_agent = true
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[agents.reviewer]
description = "Independent, read-only reviewer for T2/T3 correctness, contracts, architecture, regression risk, and test adequacy."
config_file = "agents/reviewer.toml"

[agents.security_reviewer]
description = "Independent, read-only security reviewer for T3 trust boundaries, permissions, data exposure, and injection risks."
config_file = "agents/security-reviewer.toml"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python "$(git rev-parse --show-toplevel)/.codex/hooks/harness_hook.py"'
timeout = 180
statusMessage = "Checking Bash command and commit validation"

[[hooks.PermissionRequest]]
matcher = "^Bash$"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'python "$(git rev-parse --show-toplevel)/.codex/hooks/harness_hook.py"'
timeout = 10
statusMessage = "Checking approval request"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python "$(git rev-parse --show-toplevel)/.codex/hooks/harness_hook.py"'
timeout = 180
statusMessage = "Running project validation"
